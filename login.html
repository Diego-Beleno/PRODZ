<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Prodz</title>
    <meta name="description"
        content="Inicia sesión en tu cuenta Prodz para gestionar tus reservas de sesiones de grabación.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-wrapper">

        <div
            style="position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,#ffffff18 0%,#050505 70%);pointer-events:none;z-index:0;">
        </div>

        <div class="auth-card" style="position:relative;z-index:1;">
            <div class="auth-header">
                <a href="index.html">
                    <img src="assets/images/Prodz Logo.png" alt="Prodz Logo" class="auth-logo">
                </a>
                <h1 class="auth-title">Iniciar Sesión</h1>

            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-input" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Contraseña</label>
                    <input type="password" id="login-password" class="form-input" required
                        autocomplete="current-password">
                </div>

                <div id="login-error"
                    style="display:none;background:rgba(255,50,50,0.08);border:1px solid rgba(255,50,50,0.2);color:#ff6b6b;font-size:0.78rem;padding:12px 16px;border-radius:10px;margin-bottom:16px;letter-spacing:0.5px;">
                </div>

                <button type="submit" id="login-btn" class="booking-action-btn">Entrar</button>
            </form>

            <div class="auth-footer">
                ¿No tienes cuenta? <a href="signup.html">Regístrate gratis</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script>
        (async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const pending = sessionStorage.getItem('pending_booking');
                window.location.href = pending ? 'index.html#reservas' : 'index.html';
            }
        })();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errBox = document.getElementById('login-error');
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            btn.textContent = 'Entrando...';
            btn.disabled = true;
            errBox.style.display = 'none';

            try {
                const resultado = await Promise.race([
                    supabase.auth.signInWithPassword({ email, password }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 20000))
                ]);

                if (resultado.error) {
                    errBox.textContent = resultado.error.message.toLowerCase().includes('invalid')
                        ? 'Correo o contraseña incorrectos.'
                        : `Error: ${resultado.error.message}`;
                    errBox.style.display = 'block';
                    btn.textContent = 'Entrar';
                    btn.disabled = false;
                    return;
                }

                const pending = sessionStorage.getItem('pending_booking');
                window.location.href = pending ? 'index.html#reservas' : 'index.html';
            } catch (err) {
                console.error('Login error:', err);
                errBox.textContent = err.message === 'timeout'
                    ? 'Tiempo de espera agotado. Verifica tu conexión.'
                    : `Error: ${err.message || 'intenta de nuevo'}`;
                errBox.style.display = 'block';
                btn.textContent = 'Entrar';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
